server:
  port: 18080

spring:
  # MySQL 数据源（聊天记忆持久化）
  datasource:
    url: jdbc:mysql://localhost:3306/learn?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
  application:
    name: javaAiStudent-java
  ai:
    deepseek:
      api-key: sk-5b3f957c53574a49b1cec161a4f8293c
      chat:
        model: deepseek-v4-flash
        temperature: 0.7
    # 阿里百炼 DashScope（通义千问 + 通义万相 + CosyVoice 语音合成）
    dashscope:
      api-key: sk-ws-H.EIMYEXE.MAym.MEYCIQCw_s-3HFqnC9ojNRw3HsiKbhwBwMoEp4QbrnENpFPUwwIhAMGsw5UKHBSVRjgp8birECTaoI15VR9Vg3LlEa4OPIAh
      chat:
        options:
          model: qwen-plus
      audio-speech:
        options:
          voice: longwan
          format: mp3
      audio-transcription:
        options:
          model: paraformer-v2
          format: mp3
    model:
      audio:
        speech: dashscope
        transcription: dashscope

# 打印SpringAI完整请求/响应日志（看到发给大模型的prompt、返回内容）
logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    # 可选：一并打印dashscope接口原始请求日志
    com.alibaba.cloud.ai: DEBUG