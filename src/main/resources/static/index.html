<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DeepSeek Chat</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            color: #222;
        }
        h1 { margin-bottom: 8px; }
        .hint { color: #888; margin-bottom: 20px; font-size: 14px; }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            resize: vertical;
        }
        .actions { margin-top: 12px; display: flex; gap: 8px; }
        button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2b6cb0;
            color: white;
        }
        button:disabled { background: #999; cursor: not-allowed; }
        button.secondary { background: #e2e8f0; color: #222; }
        .reply {
            background: #f7fafc;
            padding: 16px;
            border-radius: 6px;
            margin-top: 20px;
            min-height: 60px;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #e2e8f0;
            line-height: 1.6;
        }
        .reply.loading { color: #888; }
        .reply.error { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
        .meta { font-size: 12px; color: #888; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>DeepSeek Chat</h1>
    <p class="hint">Spring Boot 4 + Spring AI 2.0 · 模型: <code>deepseek-v4-flash</code></p>

    <textarea id="msg" placeholder="在这里输入你的问题...">你好，请用一句话介绍你自己</textarea>

    <div class="actions">
        <button id="sendBtn" onclick="send()">发送</button>
        <button class="secondary" onclick="document.getElementById('reply').innerText=''">清空</button>
    </div>

    <div id="reply" class="reply">回复会显示在这里…</div>
    <div id="meta" class="meta"></div>

    <script>
        async function send() {
            const msg = document.getElementById('msg').value.trim();
            if (!msg) return;
            const btn = document.getElementById('sendBtn');
            const reply = document.getElementById('reply');
            const meta = document.getElementById('meta');

            btn.disabled = true;
            reply.className = 'reply loading';
            reply.innerText = 'DeepSeek 思考中...';
            meta.innerText = '';
            const start = Date.now();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status + ' ' + res.statusText);
                }
                const data = await res.json();
                reply.className = 'reply';
                reply.innerText = data.reply || '(空响应)';
                meta.innerText = '耗时 ' + (Date.now() - start) + ' ms';
            } catch (e) {
                reply.className = 'reply error';
                reply.innerText = '请求失败: ' + e.message;
            } finally {
                btn.disabled = false;
            }
        }

        // Ctrl + Enter 发送
        document.getElementById('msg').addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') send();
        });
    </script>
</body>
</html>
